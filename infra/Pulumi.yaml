name: url-shortener
description: Oracle Cloud VM, network and Cloudflare DNS for the URL shortener (see docs/spec/infrastructure.md)
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
config:
  # Also required, set per stack: oci:tenancyOcid, oci:userOcid, oci:fingerprint,
  # oci:privateKey (secret), oci:region, cloudflare:apiToken (secret).
  ocpus:
    type: integer
    description: OCPUs for the A1 VM (Always Free total is 4 across all VMs)
  memoryInGbs:
    type: integer
    description: Memory for the A1 VM in GB (Always Free total is 24 across all VMs)
  availabilityDomainIndex:
    type: integer
    default: 0
    description: Which availability domain to use; change it to work around "out of capacity"
  sshPublicKey:
    type: string
    description: Deploy SSH public key, authorized for the deploy user
  sshAllowCidr:
    type: string
    default: ""
    description: Emergency only, a single CIDR (e.g. 203.0.113.7/32) allowed on port 22; empty keeps 22 closed
  tailscaleAuthKey:
    type: string
    secret: true
    description: Single-use, pre-approved, tag:server Tailscale auth key (expires in 1 day)
  cloudflareZoneId:
    type: string
    description: Cloudflare zone ID for cellow.space
  shortHost:
    type: string
    description: Short-link host, an A record to the VM (e.g. go-staging.cellow.space)
  appHost:
    type: string
    description: Web app host, a CNAME to Vercel (e.g. console-staging.cellow.space)
  vercelCname:
    type: string
    description: CNAME target Vercel shows for appHost
