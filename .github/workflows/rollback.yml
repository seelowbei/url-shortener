# Manual production rollback to an earlier release: redeploys that release's API image, which is
# already in GHCR, and points console.cellow.space back at that release's Vercel deployment.
# No rebuild, and versions don't change: the fix goes out as the next release.
# Spec: docs/spec/delivery.md#rollback
name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to roll production back to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/seelowbei/url-shortener

jobs:
  rollback:
    # Kamal's config (hosts, secrets references) comes from main, not from a branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://console.cellow.space
    # Shares the production job's group: never two production deploys at once, never cancelled
    # mid-run (that would leave the Kamal deploy lock held).
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      # Only ever read from the environment and validated first, never expanded into a script.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the tag
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release tags are created by release-please on main; resolve the tag to its commit.
      - name: Resolve the tag to its commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve $TAG to a commit"
            exit 1
          fi
          echo "$TAG → $sha"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The production job tagged the release's image with vX.Y.Z; Kamal deploys it by its commit
      # tag. Both must exist and be the same image.
      - name: Check the image exists
        run: |
          digest() { docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -r .digest; }
          tag_digest=$(digest "$IMAGE:$TAG") || { echo "::error::$IMAGE:$TAG not found in GHCR"; exit 1; }
          sha_digest=$(digest "$IMAGE:$SHA") || { echo "::error::$IMAGE:$SHA not found in GHCR"; exit 1; }
          if [ "$tag_digest" != "$sha_digest" ]; then
            echo "::error::$IMAGE:$TAG ($tag_digest) and $IMAGE:$SHA ($sha_digest) are different images"
            exit 1
          fi
          echo "$IMAGE:$TAG = $IMAGE:$SHA ($tag_digest)"

      # Found before anything is deployed, so a missing web deployment fails the run early.
      # The production deployment the production job created from this commit: matched on any
      # Git metadata value equal to the sha, so it works whatever the key is called.
      - name: Find the release's Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v7/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&sha=$SHA&limit=100" |
            jq -c --arg sha "$SHA" \
              '[.deployments[] | select(.meta // {} | to_entries | any(.value == $sha))] | max_by(.created) // empty | {uid, url, created}')
          if [ -z "$deployment" ]; then
            echo "::error::No ready production deployment of $SHA in Vercel (deleted by the retention policy?). Roll the web back by hand."
            exit 1
          fi
          echo "$deployment"
          echo "DEPLOYMENT_ID=$(jq -r .uid <<< "$deployment")" >> "$GITHUB_ENV"

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          working-directory: api
          bundler-cache: true

      - name: Load the deploy SSH key
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
        run: |
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$KAMAL_SSH_PRIVATE_KEY"

      - name: Deploy the API (Kamal)
        working-directory: api
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Optional: unset leaves Sentry off (the pre-connect hook allows it).
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bin/kamal deploy -d production --skip-push --version="$SHA"

      # Promote, not rollback: Hobby can only roll back to the previous production deployment,
      # and a rollback turns off auto-assignment of the production domain, so the next release's
      # `vercel deploy --prod` wouldn't take console.cellow.space. Promoting an existing production
      # deployment reassigns the domains without a rebuild and keeps auto-assignment on.
      # Through the REST API because the CLI can't load a team-scoped token's user (see pipeline.yml).
      - name: Roll back the web app (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          current() { api "https://api.vercel.com/v13/deployments/console.cellow.space?teamId=$VERCEL_ORG_ID" | jq -r .id; }
          if [ "$(current)" = "$DEPLOYMENT_ID" ]; then
            echo "console.cellow.space already serves $DEPLOYMENT_ID"
            exit 0
          fi
          api -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID"
          for _ in $(seq 1 30); do
            if [ "$(current)" = "$DEPLOYMENT_ID" ]; then
              echo "console.cellow.space → $DEPLOYMENT_ID"
              exit 0
            fi
            sleep 6
          done
          echo "::error::console.cellow.space still doesn't serve $DEPLOYMENT_ID after 3 minutes"
          exit 1

      # Both the API and the web app (through the /api rewrite) must report the release's commit
      # and version. console.cellow.space is public, so no bypass header.
      # Unlike the production job, no footer check: v0.1.0 and other early releases have no version footer,
      # and the previous step already checked that console.cellow.space serves the release's deployment.
      - name: Smoke test
        run: |
          check() {
            local url=$1 body=""
            for _ in $(seq 1 10); do
              if body=$(curl -fsS --max-time 10 "$url") &&
                [ "$(jq -r .sha <<< "$body")" = "$SHA" ] &&
                [ "$(jq -r .version <<< "$body")" = "$VERSION" ]; then
                echo "$url → $body"
                return 0
              fi
              sleep 6
            done
            echo "::error::$url did not report sha $SHA and version $VERSION (last response: ${body:-none})"
            return 1
          }
          check https://go.cellow.space/up
          check https://console.cellow.space/api/health
