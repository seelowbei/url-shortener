# Every push to main: CI → build the API image once → deploy it and the web app to staging → smoke test
# → release-please → (only when that push is the merged release PR) production, after approval.
# Spec: docs/spec/delivery.md#pipeline-pipelineyml-on-push-to-main
name: Pipeline

on:
  push:
    branches: [main]
  # Deploy the latest main to staging after starting it (`running: true` + `pulumi up`).
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/seelowbei/url-shortener

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Built once, on a native arm64 runner (the VMs are Graviton), and tagged with the commit SHA.
  # Staging and production deploy this exact image with `kamal deploy --skip-push`.
  build:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # version.txt is bumped by release-please; between releases it holds the last released version.
      - name: Read version.txt
        id: version
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      # Kamal refuses an image without the `service` label, which `kamal build` would normally add.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            service=url-shortener
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://console-staging.cellow.space
    # Queue rather than cancel: cancelling mid-deploy would leave the Kamal deploy lock held.
    # GitHub keeps only the newest pending run, so in-between commits are still skipped.
    concurrency:
      group: staging
      cancel-in-progress: false
    # "true" only when staging was online, so this job deployed and smoke-tested the commit
    # (any failure fails the job). The production job requires it.
    outputs:
      deployed: ${{ steps.staging.outputs.online }}
    env:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Joins the tailnet as an ephemeral tag:ci node; port 22 is only reachable over Tailscale.
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Staging is stopped when not in use. Skip the deploy with a notice instead of failing the run.
      - name: Check staging is running
        id: staging
        run: |
          online=$(tailscale status --json |
            jq '[.Peer // {} | .[] | select(.DNSName // "" | startswith("url-shortener-staging.")) | .Online] | any')
          echo "online=$online" >> "$GITHUB_OUTPUT"
          if [ "$online" != "true" ]; then
            echo "::notice title=Staging skipped::url-shortener-staging is offline in the tailnet, so nothing was deployed. Start it and re-run the pipeline."
          fi

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        if: steps.staging.outputs.online == 'true'
        with:
          working-directory: api
          bundler-cache: true

      - name: Load the deploy SSH key
        if: steps.staging.outputs.online == 'true'
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
        run: |
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$KAMAL_SSH_PRIVATE_KEY"

      - name: Deploy the API (Kamal)
        if: steps.staging.outputs.online == 'true'
        working-directory: api
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bin/kamal deploy -d staging --skip-push --version="$GITHUB_SHA"

      # A preview deploy (Preview env, so API_ORIGIN is the staging API), then the staging alias.
      # Runs from the repo root because the Vercel project's root directory is web/.
      # The alias goes through the REST API: `vercel alias` first loads the token's user, which a
      # team-scoped token can't do ("User not found"), with or without --scope.
      - name: Deploy the web app (Vercel)
        if: steps.staging.outputs.online == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global --no-fund --no-audit vercel@66.6.0
          url=$(vercel deploy --yes --token "$VERCEL_TOKEN")
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          id=$(api "https://api.vercel.com/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          api -X POST -H "Content-Type: application/json" \
            -d '{"alias":"console-staging.cellow.space"}' \
            "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" | jq -c '{alias, created}'

      # Both the API and the web app (through the /api rewrite) must report this commit.
      # The links round trip (POST /api/links → GET /:code) joins once those endpoints exist.
      - name: Smoke test
        if: steps.staging.outputs.online == 'true'
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          check() {
            local url=$1 body=""
            shift
            for _ in $(seq 1 10); do
              if body=$(curl -fsS --max-time 10 "$@" "$url") && [ "$(jq -r .sha <<< "$body")" = "$GITHUB_SHA" ]; then
                echo "$url → $body"
                return 0
              fi
              sleep 6
            done
            echo "::error::$url did not report sha $GITHUB_SHA (last response: ${body:-none})"
            return 1
          }
          check https://go-staging.cellow.space/up
          check https://console-staging.cellow.space/api/health -H "x-vercel-protection-bypass: $BYPASS"
          # The footer shows the web app's own version, inlined from version.txt at build time.
          version=$(tr -d '[:space:]' < version.txt)
          html=$(curl -fsS --max-time 10 -H "x-vercel-protection-bypass: $BYPASS" https://console-staging.cellow.space/)
          grep -qF "v$version" <<< "$html" || { echo "::error::console-staging footer does not show v$version"; exit 1; }

  # Opens or updates the release PR (`chore(main): release X.Y.Z`). When this push is the merged
  # release PR, it tags vX.Y.Z and creates the GitHub Release instead.
  # Runs after staging, so a release is only cut from a commit that went through it.
  # It uses a GitHub App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger
  # workflows, so CI wouldn't run on the release PR and branch protection would block it.
  release-please:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never run two at once: both could try to update the same release PR or create the same tag.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Scoped to what release-please needs: commits/tags/releases, the PR, and its labels.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Reads release-please-config.json and .release-please-manifest.json from the repo root.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The release exists now, but production only deploys a commit that staging deployed and
      # smoke-tested. Fail loudly instead of silently skipping production.
      - name: Check staging ran this release
        if: steps.release.outputs.release_created == 'true' && needs.staging.outputs.deployed != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "::error title=Production not deployed::$TAG was released, but staging was offline, so this commit never ran on staging and the production job is skipped. Deploy $TAG to production by hand once it has been checked on staging."
          exit 1

  # Runs only for the merged release PR, after release-please created the tag and GitHub Release.
  # Waits for approval in the `production` environment, then ships the exact image staging just
  # ran: it adds the release tag to the commit's image and deploys it by its commit tag.
  production:
    needs: [staging, release-please]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://console.cellow.space
    # Never cancel a production deploy mid-run: it would leave the Kamal deploy lock held.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-side copy of the manifest: no pull, no rebuild. rollback.yml deploys by this tag.
      - name: Tag the image with the release
        run: docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$GITHUB_SHA"

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          working-directory: api
          bundler-cache: true

      - name: Load the deploy SSH key
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
        run: |
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$KAMAL_SSH_PRIVATE_KEY"

      - name: Deploy the API (Kamal)
        working-directory: api
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bin/kamal deploy -d production --skip-push --version="$GITHUB_SHA"

      # A production deploy of the same commit (Production env, so API_ORIGIN is the prod API).
      # Vercel assigns console.cellow.space, the project's production domain, once it's ready.
      # Built on Vercel like staging: API_ORIGIN is a sensitive variable, which `vercel pull`
      # can't download, so a --prebuilt build in CI would miss it.
      - name: Deploy the web app (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global --no-fund --no-audit vercel@66.6.0
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      # Both the API and the web app (through the /api rewrite) must report this commit and the
      # release version. console.cellow.space is public, so no bypass header.
      # The links round trip (with the throwaway link deleted) joins once those endpoints exist.
      - name: Smoke test
        run: |
          check() {
            local url=$1 body=""
            for _ in $(seq 1 10); do
              if body=$(curl -fsS --max-time 10 "$url") &&
                [ "$(jq -r .sha <<< "$body")" = "$GITHUB_SHA" ] &&
                [ "$(jq -r .version <<< "$body")" = "$VERSION" ]; then
                echo "$url → $body"
                return 0
              fi
              sleep 6
            done
            echo "::error::$url did not report sha $GITHUB_SHA and version $VERSION (last response: ${body:-none})"
            return 1
          }
          check https://go.cellow.space/up
          check https://console.cellow.space/api/health
          # The footer shows the web app's own version, inlined from version.txt at build time.
          html=$(curl -fsS --max-time 10 https://console.cellow.space/)
          grep -qF "v$VERSION" <<< "$html" || { echo "::error::console.cellow.space footer does not show v$VERSION"; exit 1; }
