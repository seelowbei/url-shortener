# Staging destination: EC2 url-shortener-staging (t4g.micro, 1 GB), reached over Tailscale.
# Merged over config/deploy.yml. Secrets: .kamal/secrets.staging.
servers:
  web:
    - url-shortener-staging

proxy:
  host: go-staging.cellow.space

env:
  clear:
    APP_ENV: staging
    SHORT_HOST: go-staging.cellow.space
    ALLOWED_ORIGINS: https://console-staging.cellow.space

accessories:
  db:
    host: url-shortener-staging
    # Sized for a 1 GB VM shared with Rails. Each app container can open up to 15 connections
    # (3 pools of 5), and a deploy briefly runs two, so 40 leaves headroom.
    cmd: postgres -c shared_buffers=128MB -c max_connections=40
