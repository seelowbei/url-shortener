# Kamal: settings shared by every destination. config/deploy.<destination>.yml adds the host,
# proxy host and per-environment env, and is deep-merged over this file.
# Deploy with `bin/kamal deploy -d staging` (first time: `bin/kamal setup -d staging`).
# Spec: docs/spec/infrastructure.md#kamal
service: url-shortener

# Pushed to ghcr.io/seelowbei/url-shortener, tagged with the commit SHA.
image: seelowbei/url-shortener

# Refuse to run without -d, so nothing is ever deployed to an unnamed environment.
require_destination: true

# SSH over Tailscale as the deploy user (port 22 is closed to the internet).
# The key comes from ~/.ssh/config on the laptop, and from ssh-agent in CI.
ssh:
  user: deploy

registry:
  server: ghcr.io
  username: seelowbei
  password:
    - KAMAL_REGISTRY_PASSWORD

# Built natively on Apple Silicon or GitHub's arm64 runner; the VMs are Graviton (arm64).
builder:
  arch: arm64
  args:
    GIT_SHA: <%= `git rev-parse HEAD`.strip %>

# kamal-proxy: Let's Encrypt TLS for the destination's host, health check on /up.
# Thruster listens on port 80 inside the container and forwards to Puma.
proxy:
  ssl: true
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

env:
  clear:
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 1
    RAILS_MAX_THREADS: 3
  # Every secret is a per-environment env var (GitHub environment secrets), never a credentials
  # file: SECRET_KEY_BASE differs between staging and production.
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD

# Postgres on the same VM. The app reaches it as url-shortener-db over the kamal Docker network.
# Port 5432 is only bound to the VM's localhost, for SSH tunnels from the laptop.
# Data lives on the VM in ~deploy/url-shortener-db/data. Pin the major version; upgrades are
# dump → restore.
accessories:
  db:
    image: postgres:17
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: url_shortener
        POSTGRES_DB: url_shortener_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
